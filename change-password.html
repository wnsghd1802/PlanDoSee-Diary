<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 변경 · 플랜두씨 다이어리</title>
  <style>
    :root{
      --bg:#f4f8fb; --card:#fff; --line:#dbe6ee; --text:#1d2a33; --muted:#6d7b86;
      --primary:#146b7d; --primary2:#1c879b; --shadow:0 10px 30px rgba(20,50,70,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);background:linear-gradient(180deg,#edf6f9 0,#f8fbfc 42%,#f4f8fb 100%);min-height:100vh}
    button,input{font:inherit}
    button{cursor:pointer}
    .screen{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
    .head{padding:26px;border-bottom:1px solid var(--line)}
    .head h1{margin:0;font-size:27px}
    .body{padding:24px 26px 26px}
    label{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:#4b5b65}
    input{width:100%;border:1px solid #cfdce4;border-radius:11px;padding:11px 12px;background:#fff;outline:none}
    input:focus{border-color:var(--primary2);box-shadow:0 0 0 3px rgba(28,135,155,.11)}
    .field{margin-top:12px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:10px 14px;font-weight:800;text-decoration:none}
    .primary{background:var(--primary);color:#fff}
    .ghost{background:#fff;border:1px solid var(--line);color:#41535e}
    .message{display:none;margin-bottom:14px;padding:11px 12px;border-radius:10px;font-size:13px;line-height:1.5}
    .message.show{display:block}
    .message.error{background:#fff0f0;color:#9d4545;border:1px solid #f0caca}
    .message.success{background:#eef8f2;color:#347152;border:1px solid #cfe7d9}
  </style>
</head>
<body>
<section class="screen">
  <div class="card">
    <div class="head"><h1>비밀번호 변경</h1></div>
    <div class="body">
      <div class="message" id="message"></div>

      <form id="changeForm">
        <div>
          <label for="currentPassword">현재 비밀번호</label>
          <input id="currentPassword" type="password" autocomplete="current-password" placeholder="현재 비밀번호 입력">
        </div>

        <div class="field">
          <label for="newPassword">새 비밀번호</label>
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="새 비밀번호 입력">
        </div>

        <div class="field">
          <label for="newPasswordConfirm">새 비밀번호 확인</label>
          <input id="newPasswordConfirm" type="password" autocomplete="new-password" placeholder="새 비밀번호 다시 입력">
        </div>

        <div class="actions">
          <button class="btn primary" type="submit" id="changeBtn">변경하기</button>
          <a class="btn ghost" href="index.html">취소</a>
        </div>
      </form>
    </div>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);

function showMessage(message, type="error"){
  const el=$("#message");
  el.textContent=message;
  el.className=`message show ${type}`;
}

async function ensureLogin(){
  try{
    const res=await fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"});
    if(!res.ok) location.replace("login.html");
  }catch{
    location.replace("login.html");
  }
}

$("#changeForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const currentPassword=$("#currentPassword").value;
  const newPassword=$("#newPassword").value;
  const confirm=$("#newPasswordConfirm").value;

  if(!currentPassword || !newPassword || !confirm){
    showMessage("모든 항목을 입력해 주세요.");
    return;
  }

  if(newPassword!==confirm){
    showMessage("새 비밀번호와 비밀번호 확인이 일치하지 않습니다.");
    return;
  }

  $("#changeBtn").disabled=true;

  try{
    const res=await fetch("/api/auth/change-password",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"same-origin",
      body:JSON.stringify({currentPassword,newPassword})
    });

    let data={};
    try{data=await res.json();}catch{}

    if(!res.ok){
      showMessage(data.message||"비밀번호를 변경하지 못했습니다.");
      return;
    }

    showMessage("비밀번호가 변경되었습니다. 다시 로그인해 주세요.","success");
    $("#changeForm").style.display="none";
    setTimeout(()=>location.replace("login.html"),1200);
  }catch{
    showMessage("서버에 연결하지 못했습니다.");
  }finally{
    $("#changeBtn").disabled=false;
  }
});

ensureLogin();
</script>
</body>
</html>
