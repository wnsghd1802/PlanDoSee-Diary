<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>플랜두씨 다이어리 회원가입</title>
  
<style>
  :root{
    --bg:#f4f8fb; --card:#ffffff; --line:#dbe6ee; --text:#1d2a33; --muted:#6d7b86;
    --primary:#146b7d; --primary2:#1c879b; --danger:#b94b4b; --green:#347152;
    --shadow:0 10px 30px rgba(20,50,70,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,#edf6f9 0,#f8fbfc 42%,#f4f8fb 100%);
    min-height:100vh;
  }
  button,input{font:inherit}
  button{cursor:pointer}
  .auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px}
  .auth-card{
    width:min(440px,100%);
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .auth-head{
    padding:26px 26px 18px;
    background:linear-gradient(135deg,#eef8fa,#ffffff);
    border-bottom:1px solid var(--line);
  }
  .auth-head h1{margin:0 0 8px;font-size:27px;letter-spacing:-.03em}
  .auth-head p{margin:0;color:var(--muted);line-height:1.55}
  .auth-body{padding:24px 26px 26px}
  label{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:#4b5b65}
  input{
    width:100%;border:1px solid #cfdce4;border-radius:11px;padding:11px 12px;
    background:#fff;outline:none;
  }
  input:focus{border-color:var(--primary2);box-shadow:0 0 0 3px rgba(28,135,155,.11)}
  .field{margin-top:12px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    border:0;border-radius:10px;padding:10px 14px;font-weight:800;text-decoration:none;
  }
  .btn.primary{background:var(--primary);color:#fff}
  .btn.secondary{background:#edf3f6;color:#3a515e}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:#41535e}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .auth-message{
    display:none;margin:0 0 14px;padding:11px 12px;border-radius:10px;
    font-size:13px;line-height:1.5;
  }
  .auth-message.show{display:block}
  .auth-message.error{background:#fff0f0;color:#9d4545;border:1px solid #f0caca}
  .auth-message.success{background:#eef8f2;color:var(--green);border:1px solid #cfe7d9}
  .auth-help{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6}
  .switch-box{
    margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    color:var(--muted);font-size:13px;
  }
  .success-actions{display:none;margin-top:18px;justify-content:center}
  .success-actions.show{display:flex}
  .success-state{display:none;text-align:center;padding:8px 0 2px}
  .success-state.show{display:block}
  .success-icon{
    width:54px;height:54px;margin:0 auto 14px;border-radius:50%;
    display:grid;place-items:center;background:#eef8f2;color:#347152;
    font-size:28px;font-weight:900;border:1px solid #cfe7d9;
  }
  .success-title{font-size:20px;font-weight:900;margin:0 0 7px}
  .success-text{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
</style>

</head>
<body>
<section class="auth-screen">
  <div class="auth-card">
    <div class="auth-head">
      <h1 id="pageTitle">회원가입</h1>
      <p id="pageSubtitle" style="display:none"></p>
      
    </div>
    <div class="auth-body">
      <div class="auth-message" id="authMessage"></div>

      <form id="signupForm">
        <div>
          <label for="signupUsername">아이디</label>
          <input id="signupUsername" type="text" autocomplete="username" maxlength="20" placeholder="아이디 입력">
        </div>

        <div class="field">
          <label for="signupPassword">비밀번호</label>
          <input id="signupPassword" type="password" autocomplete="new-password" placeholder="비밀번호 입력">
        </div>

        <div class="field">
          <label for="signupPasswordConfirm">비밀번호 확인</label>
          <input id="signupPasswordConfirm" type="password" autocomplete="new-password" placeholder="비밀번호 다시 입력">
        </div>

        <div class="actions">
          <button class="btn primary" type="submit" id="signupBtn">가입하기</button>
          <a class="btn ghost" href="login.html">로그인으로 돌아가기</a>
        </div>
      </form>

      <div class="success-state" id="successState">
        <div class="success-icon">✓</div>
        <div class="success-title">회원가입이 완료되었습니다.</div>
        <p class="success-text">로그인 페이지에서 로그인해 주세요.</p>
      </div>

      <div class="success-actions" id="successActions">
        <a class="btn primary" href="login.html">로그인하기</a>
      </div>
    </div>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);

function setAuthMessage(message="", type="error"){
  const el=$("#authMessage");
  el.textContent=message;
  el.className="auth-message"+(message?` show ${type}`:"");
}

function normalizeUsername(value=""){
  return value.trim().toLowerCase();
}

async function signUp(event){
  event.preventDefault();

  const username=normalizeUsername($("#signupUsername").value);
  const password=$("#signupPassword").value;
  const passwordConfirm=$("#signupPasswordConfirm").value;

  if(!username || !password || !passwordConfirm){
    setAuthMessage("아이디와 비밀번호를 모두 입력해 주세요.");
    return;
  }

  if(password!==passwordConfirm){
    setAuthMessage("비밀번호와 비밀번호 확인이 일치하지 않습니다.");
    return;
  }

  $("#signupBtn").disabled=true;

  try{
    const response=await fetch("/api/auth/signup",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"same-origin",
      body:JSON.stringify({username,password})
    });

    let data={};
    try{ data=await response.json(); }catch{}

    if(!response.ok){
      setAuthMessage(data.message||"회원가입에 실패했습니다.");
      return;
    }

    setAuthMessage("");
    $("#signupForm").style.display="none";
    $("#pageTitle").textContent="가입 완료";
    $("#successState").classList.add("show");
    $("#successActions").classList.add("show");
  }catch{
    setAuthMessage("서버에 연결하지 못했습니다.");
  }finally{
    $("#signupBtn").disabled=false;
  }
}

$("#signupForm").addEventListener("submit",signUp);
</script>
</body>
</html>
